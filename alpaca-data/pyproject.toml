[project]
name = "alpaca-data"
version = "0.1.0"
description = "Alpaca historical + streaming market-data engine (stocks, options, news, corporate actions) feeding a DuckDB/Parquet research lake."
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.43,<0.44",
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15",
    "duckdb>=1.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alpaca_data*"]
